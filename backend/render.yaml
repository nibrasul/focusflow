services:
  - type: web
    name: focusflow-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL
        fromDatabase:
          name: focusflow-db
          property: connectionString

databases:
  - name: focusflow-db
    plan: free
